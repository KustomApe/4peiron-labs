server {
    listen 80;
    server_name members.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name members.example;

    ssl_certificate     /etc/ssl/members/fullchain.pem;
    ssl_certificate_key /etc/ssl/members/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=300" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/members/static/;
        expires 7d;
    }

    location /uploads/ {
        alias /var/www/members/uploads/;
        autoindex on;
        add_header X-Content-Type-Options nosniff;
    }
}
